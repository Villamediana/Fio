<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F3EBDD; --card: #FBF6EC; --ink: #3A2A1F; --muted: #7A6656; --accent: #C2593A; --line: #E2D5C1; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #221A15; --card: #2B221C; --ink: #F1E6D6; --muted: #B9A692; --accent: #E07A5A; --line: #3D312A; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.65 Nunito, system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 36px; }
  .mark { font: 400 34px/1 Fraunces, Georgia, serif; letter-spacing: -0.01em; }
  .mark span { color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; margin-left: 14px; font-weight: 600; font-size: 15px; }
  nav a[aria-current] { color: var(--accent); }
  h1 { font: 400 30px/1.2 Fraunces, Georgia, serif; margin: 0 0 6px; }
  .date { color: var(--muted); font-size: 15px; margin: 0 0 28px; }
  h2 { font: 400 21px/1.3 Fraunces, Georgia, serif; margin: 34px 0 8px; }
  p, li { margin: 0 0 12px; }
  ul { padding-left: 20px; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1.5px dashed var(--line); border-radius: 18px; padding: 18px 20px; margin: 22px 0; }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="mark">Novelo<span>.</span></div>
  </header>
  <h1>Um botão pra tirar as coisas da cabeça.</h1>
  <p class="date">Você fala, o Novelo guarda: tarefas, notas e diário.</p>
  <div class="card">
    <p>Privacidade · <a href="privacidade.html">Português</a> · <a href="privacidad.html">Español</a> · <a href="privacy.html">English</a></p>
  </div>
  <footer>Contato: <a href="mailto:miguel.villamediana@outlook.com">miguel.villamediana@outlook.com</a></footer>
</main>
</body>
</html>
