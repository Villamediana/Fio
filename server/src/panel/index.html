<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Novelo · Painel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23C2593A%22/%3E%3Ccircle cx=%2215%22 cy=%2215%22 r=%227.5%22 fill=%22none%22 stroke=%22%23FFF8EE%22 stroke-width=%222.2%22/%3E%3Cpath d=%22M20.5 20.5c2 2 4 2.5 4.5 4%22 fill=%22none%22 stroke=%22%23FFF8EE%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/admin/panel.css">
<script src="/admin/panel.js" defer></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="mark">Novelo<span>.</span></div>
      <p class="muted">Painel</p>
      <label>Chave<input id="login-key" type="password" autocomplete="current-password" required></label>
      <label>Código do autenticador<input id="login-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000"></label>
      <button type="submit">Entrar</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="top">
      <div class="mark">Novelo<span>.</span></div>
      <nav id="tabs">
        <button data-tab="overview" aria-current="page">Visão geral</button>
        <button data-tab="people">Pessoas</button>
        <button data-tab="settings">Ajustes</button>
        <button data-tab="audit">Registro</button>
      </nav>
      <button id="logout" class="quiet">Sair</button>
    </header>
    <main>
      <section id="overview" class="tab"></section>
      <section id="people" class="tab" hidden></section>
      <section id="settings" class="tab" hidden></section>
      <section id="audit" class="tab" hidden></section>
    </main>
  </div>
</body>
</html>
